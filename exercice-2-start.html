<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <style>
    body {
      background-color: #25384B;
      margin: 0;
      padding: 0;
    }

    .main {
      height: 100vh;
      background: #25384B;
      display: flex;
      flex-direction: row;
      padding: 0 3em;
      gap: 3em;
      box-sizing: border-box;
    }

    .left-section {
      background: #A3CFCC;
      flex: 1;
    }

    .right-section {
      background: #F7CFB6;
      flex: 1;
      height: 100vh;
      width: 10em;
      display: flex;
      flex-direction: column;
      gap: 1em;
      padding: 1em;
      box-sizing: border-box;
      align-self: flex-start;
    }

    .item {
      background: #86C2DE;
      height: 500px;
    }
  </style>
</head>

<body>
  <div class="main">
    <section class="left-section"></section>
    <section class="right-section">
      <div class="item"></div>
      <div class="item"></div>
      <div class="item"></div>
    </section>
  </div>
</body>

</html>
