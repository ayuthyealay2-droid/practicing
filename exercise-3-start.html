<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <style>
        body {
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
            background-color: #ffffff;
            height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            height: 100%;
            box-sizing: border-box;
        }

        header {
            background-color: #2f80ed;
            border-radius: 0.5rem;
            padding: 1.5rem;
            color: white;
            font-weight: bold;
        }

        .middle-row {
            display: flex;
            gap: 1rem;
            flex: 1;
 
        }

        main {
            background-color: #27ae60;
            border-radius: 0.5rem;
            padding: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-content: flex-start;
        }

        .sidebar {
            background-color: #eb5757;
            border-radius: 0.5rem;
            width: 200px;
            padding: 1rem;
            color: white;
            font-weight: bold;
        }

        .item {
            background-color: #219653;
            border-radius: 0.5rem;
            flex: 0 0 calc(20% - 10px);
            width: 90px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        footer {
            background-color: #3b82f6;
            border-radius: 0.5rem;
            padding: 1.5rem;
            color: white;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>header</header>
        <div class="middle-row">
            <main>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
            </main>
            <aside class="sidebar">sidebar</aside>
        </div>
        <footer>footer</footer>
    </div>
</body>

</html>
